{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | FitLife</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;color:#f4f6f1;font:16px/1.5 Arial,Helvetica,sans-serif;background:linear-gradient(90deg,rgba(6,8,7,.96),rgba(6,8,7,.79)),url("{% static 'img/fitlife-portada.png' %}") center/cover fixed no-repeat #090b0a}
    .error-page{min-height:100vh;display:flex;flex-direction:column;max-width:1400px;margin:auto;padding:2rem 4%}
    .brand{display:inline-flex;align-items:center;gap:.7rem;width:max-content;color:#f4f6f1;text-decoration:none;font-size:1.35rem;font-weight:900;letter-spacing:.16em}
    .brand-mark{display:grid;place-items:center;width:2.2rem;height:2.2rem;background:#c5fa00;color:#111;clip-path:polygon(20% 0,100% 0,80% 100%,0 100%);font-style:italic;letter-spacing:0}
    main{flex:1;display:grid;place-items:center;padding:3rem 0 5rem}
    .error-card{width:min(100%,610px);padding:3.5rem 3rem;text-align:center;background:#141715;border:1px solid #39413b;border-radius:16px;box-shadow:0 20px 55px #0006}
    .eyebrow{margin:0 0 .6rem;color:#c5fa00;font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
    .error-code{margin:0;color:#c5fa00;font-size:clamp(5rem,13vw,8rem);font-weight:900;letter-spacing:-.06em;line-height:1}
    h1{margin:1.25rem 0 .8rem;font-size:clamp(1.55rem,3vw,2rem);line-height:1.2}
    .description{max-width:430px;margin:0 auto;color:#b5bdb6;line-height:1.65}
    .home-link{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;margin-top:2rem;padding:.85rem 1.35rem;border:1px solid #c5fa00;border-radius:9px;background:#c5fa00;color:#10130b;font-weight:700;text-decoration:none}
    .home-link:hover{background:#ddff67;border-color:#ddff67}
    a:focus-visible{outline:2px solid #c5fa00;outline-offset:4px}
    @media(max-width:600px){.error-page{padding:1.3rem 5%}.brand{font-size:1.1rem}main{padding:2rem 0 4rem}.error-card{padding:2.6rem 1.4rem}.description{font-size:.95rem}}
  </style>
</head>
<body>
  <div class="error-page">
    <a class="brand" href="{% url 'raiz' %}" aria-label="FitLife, ir al inicio"><span class="brand-mark" aria-hidden="true">F</span><span>FITLIFE</span></a>
    <main>
      <section class="error-card" aria-labelledby="error-title">
        <p class="eyebrow">Página no encontrada</p>
        <p class="error-code" aria-hidden="true">404</p>
        <h1 id="error-title">Parece que tomaste una ruta fuera del circuito</h1>
        <p class="description">La página que buscas no existe o fue trasladada. Vuelve al inicio para seguir explorando FitLife.</p>
        <a class="home-link" href="{% url 'raiz' %}">← Volver al inicio</a>
      </section>
    </main>
  </div>
</body>
</html>
